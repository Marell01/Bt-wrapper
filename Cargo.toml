[package]
name = "bluetooth_wrapper"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["full"] }  # Async runtime support
# Enable the bluetoothd feature which provides the Result type and other functionality
bluer = { version = "0.17.3", features = ["bluetoothd"] }
clap = { version = "4.4", features = ["derive"] }  # Command-line argument parsing
futures = "0.3"  # Utilities for working with async code
dialoguer = "0.11"  # Terminal user interface for menus
text_io = "0.1"    # Simple text input
console = "0.15"   # Terminal colors and utility
